<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Caché - SG Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .info-box {
            background: #edf2f7;
            border-left: 4px solid #4299e1;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .info-box p {
            color: #2d3748;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        
        .log {
            background: #1a202c;
            color: #48bb78;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
        }
        
        .log.show {
            display: block;
        }
        
        .log-line {
            margin-bottom: 5px;
        }
        
        .success {
            color: #48bb78;
        }
        
        .warning {
            color: #f6ad55;
        }
        
        .error {
            color: #fc8181;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiar Caché</h1>
        <p class="subtitle">Herramienta de diagnóstico para SG Reports</p>
        
        <div class="info-box">
            <p><strong>¿Cuándo usar esto?</strong></p>
            <p>Si experimentas problemas como "Sin resultados disponibles" o datos que no cargan correctamente, esta herramienta limpiará toda la caché del navegador y te permitirá empezar de nuevo.</p>
        </div>
        
        <button class="btn btn-primary" onclick="clearCache()">
            🗑️ Limpiar Caché Completo
        </button>
        
        <button class="btn btn-secondary" onclick="viewCache()">
            👁️ Ver Caché Actual
        </button>
        
        <button class="btn btn-secondary" onclick="goToLogin()">
            🏠 Ir al Login
        </button>
        
        <div id="log" class="log"></div>
    </div>
    
    <script>
        function addLog(message, type = 'success') {
            const log = document.getElementById('log');
            log.classList.add('show');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }
        
        function clearCache() {
            const log = document.getElementById('log');
            log.innerHTML = '';
            log.classList.add('show');
            
            addLog('🧹 Iniciando limpieza de caché...', 'warning');
            
            // Limpiar localStorage
            const localKeys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) localKeys.push(key);
            }
            
            addLog(`\n📦 localStorage: ${localKeys.length} claves encontradas`);
            localKeys.forEach(key => {
                addLog(`   ✓ Eliminando: ${key}`);
                localStorage.removeItem(key);
            });
            
            // Limpiar sessionStorage
            const sessionKeys = [];
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) sessionKeys.push(key);
            }
            
            addLog(`\n📦 sessionStorage: ${sessionKeys.length} claves encontradas`);
            sessionKeys.forEach(key => {
                addLog(`   ✓ Eliminando: ${key}`);
                sessionStorage.removeItem(key);
            });
            
            addLog('\n✅ Caché limpiado completamente', 'success');
            addLog('🔄 Recarga la página o ve al login para empezar de nuevo', 'warning');
        }
        
        function viewCache() {
            const log = document.getElementById('log');
            log.innerHTML = '';
            log.classList.add('show');
            
            addLog('👁️ Inspeccionando caché actual...', 'warning');
            
            // Ver localStorage
            addLog(`\n📦 localStorage (${localStorage.length} claves):`);
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) {
                    const value = localStorage.getItem(key);
                    const size = value ? (value.length / 1024).toFixed(2) : '0';
                    addLog(`   • ${key} (${size} KB)`);
                }
            }
            
            // Ver sessionStorage
            addLog(`\n📦 sessionStorage (${sessionStorage.length} claves):`);
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) {
                    const value = sessionStorage.getItem(key);
                    const size = value ? (value.length / 1024).toFixed(2) : '0';
                    addLog(`   • ${key} (${size} KB)`);
                }
            }
            
            // Calcular tamaño total
            let totalSize = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) {
                    const value = localStorage.getItem(key);
                    if (value) totalSize += value.length;
                }
            }
            
            addLog(`\n💾 Tamaño total: ${(totalSize / 1024).toFixed(2)} KB`, 'success');
        }
        
        function goToLogin() {
            window.location.href = '/login';
        }
    </script>
</body>
</html>
